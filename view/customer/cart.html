<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - TechnoStore</title>
  <meta name="description" content="Xem và cập nhật các sản phẩm trong giỏ hàng trước khi thanh toán.">

  <!-- CSS Stylesheets (Đã gộp base.css & components.css) -->
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/page/cart.css">
</head>

<body>

  <!-- Header -->
  <div id="headerContainer"></div>

  <!-- Cart Page Dynamic Content -->
  <main id="cartPageContent"></main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Floating Nav -->
  <div id="floatingNavContainer"></div>

  <!-- JavaScript Modules -->
  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/display.js"></script>
  <script src="../../js/cart.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderStoreHeader('headerContainer', {
        basePath: '../../',
        viewPath: '../',
        activePage: 'cart'
      });

      renderStoreFooter('footerContainer', {
        basePath: '../../',
        viewPath: '../'
      });

      renderFloatingNav('floatingNavContainer', {
        basePath: '../../',
        viewPath: '../',
        active: 'store'
      });

      initCartPage({
        basePath: '../../'
      });
    });
  </script>
</body>

</html>
