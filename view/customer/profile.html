<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin tài khoản - TechnoStore</title>
  <meta name="description" content="Quản lý thông tin tài khoản, sổ địa chỉ và đơn hàng TechnoStore.">

  <!-- CSS Stylesheets (Đã gộp base.css & components.css) -->
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/page/auth.css">
</head>

<body>

  <!-- Header -->
  <div id="headerContainer"></div>

  <!-- Profile Page Content -->
  <main id="profilePageContent"></main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Floating Nav -->
  <div id="floatingNavContainer"></div>

  <!-- JavaScript Modules -->
  <script src="../../js/data.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/display.js"></script>
  <script src="../../js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderStoreHeader('headerContainer', {
        basePath: '../../',
        viewPath: '../',
        activePage: 'profile'
      });

      renderStoreFooter('footerContainer', {
        basePath: '../../',
        viewPath: '../'
      });

      renderFloatingNav('floatingNavContainer', {
        basePath: '../../',
        viewPath: '../',
        active: 'store'
      });

      initProfilePage({
        basePath: '../../',
        defaultTab: 'orders'
      });
    });
  </script>
</body>

</html>
